# Render Blueprint: servicio web (Node, plan gratis).
# La liga usa una base PostgreSQL existente: pon su "Internal Database URL"
# en la variable DATABASE_URL (Render la pide al aplicar el Blueprint).
# El servidor solo usa su propia tabla: semillin_jugadores.
services:
  - type: web
    name: semillin-run
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: node server.js
    healthCheckPath: /api/salud
    envVars:
      - key: DATABASE_URL
        sync: false

# Render Blueprint: servicio web (Node) + base de datos PostgreSQL para la liga.
services:
  - type: web
    name: semillin-run
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: node server.js
    healthCheckPath: /api/salud
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: semillin-liga
          property: connectionString
databases:
  - name: semillin-liga
    plan: free
    databaseName: semillin
    user: semillin
